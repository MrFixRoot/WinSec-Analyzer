name: Structure and privacy checks
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -v
      - name: Verify development instructions stay private
        shell: bash
        run: |
          git check-ignore -q AGENTS.md
          git check-ignore -q src/collectors/SystemSecurity/AGENTS.md
          git check-ignore -q CONTRIBUTING.md
          git check-ignore -q docs/architecture.md
      - name: Verify user help is tracked
        shell: bash
        run: |
          git ls-files --error-unmatch help/README.md help/SystemSecurity.md \
            help/NetworkSecurity.md help/IdentityAccess.md help/ServicesHardening.md \
            help/LoggingAuditing.md help/PatchManagement.md
      - name: Verify private snapshots ignored
        shell: bash
        run: |
          git check-ignore -q device/Windows11_Pro_26100/TEST/SNAPSHOT/manifest.json
          git check-ignore -q device/inventory.json
          git check-ignore -q scans/private.scan.json
          git check-ignore -q config/baselines/local/personal.json
